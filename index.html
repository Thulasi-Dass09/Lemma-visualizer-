function solve(src){const m=src.split('=');if(m.length>2||!m[0].trim())throw Error('Write one equation in x, such as 2x + 6 = 14');const L=m[0].trim(),rhs=(m[1]||'0').trim(),
f=x=>{const v=math.evaluate(`(${L})-(${rhs})`,{x});if(typeof v!=='number'||!isFinite(v))throw Error('The equation must be real-valued in x');return v},g=x=>{try{return f(x)}catch{return NaN}};
const c=f(0),p=f(1),q=f(-1),a=(p+q)/2-c,b=(p-q)/2,tol=1e-7,N=n=>String(+n.toFixed(6)||0),sg=n=>n<0?'−':'+',st=[{t:'Move every term to the left side',m:`(${L}) − (${rhs}) = 0`}];
if(![2,3,-1.5].every(x=>Math.abs(f(x)-(a*x*x+b*x+c))<tol*(1+Math.abs(f(x))))){let r=[],px=-50,pv=g(px);for(let i=1;i<=4000;i++){const x=-50+i*.025,v=g(x);if(pv===0)r.push(px);else if(pv*v<0){let lo=px,hi=x;for(let k=0;k<60;k++){const mid=(lo+hi)/2;g(lo)*g(mid)<=0?hi=mid:lo=mid}r.push((lo+hi)/2)}px=x;pv=v}
r=[...new Set(r.map(x=>+x.toFixed(5)))].slice(0,8);st.push({t:'Not a linear or quadratic polynomial, so scan x from −50 to 50 for sign changes and refine each with bisection',m:r.length?r.map((x,i)=>`x${'₀₁₂₃₄₅₆₇₈₉'[i+1]||''} ≈ ${N(x)}`).join(',  '):'No real roots found in [−50, 50]'});return{steps:st,ans:r.length?r.map(x=>'x ≈ '+N(x)).join(' or '):'No real roots found in [−50, 50]'}}
if(Math.abs(a)<tol){if(Math.abs(b)<tol){st.push({t:'All x-terms cancel',m:`${N(c)} = 0`});return{steps:st,ans:Math.abs(c)<tol?'True for every x (identity)':'No solution'}}const x=-c/b;
st.push({t:'Collect like terms',m:`${N(b)}x ${sg(c)} ${N(Math.abs(c))} = 0`},{t:(c<0?`Add ${N(-c)}`:`Subtract ${N(c)}`)+' on both sides',m:`${N(b)}x = ${N(-c)}`},{t:`Divide both sides by ${N(b)}`,m:`x = ${N(x)}`},{t:'Check by substituting back',m:`left − right = ${N(f(x))} ✓`});return{steps:st,ans:`x = ${N(x)}`}}
const D=b*b-4*a*c;st.push({t:'Collect like terms into standard form',m:`${N(a)}x² ${sg(b)} ${N(Math.abs(b))}x ${sg(c)} ${N(Math.abs(c))} = 0`},{t:'Compute the discriminant  Δ = b² − 4ac',m:`Δ = (${N(b)})² − 4·(${N(a)})·(${N(c)}) = ${N(D)}`});
if(D>1e-9){const s=Math.sqrt(D),x1=(-b+s)/(2*a),x2=(-b-s)/(2*a);st.push({t:'Δ > 0: two real roots from the quadratic formula',m:`x = (−b ± √Δ) / 2a = (${N(-b)} ± ${N(s)}) / ${N(2*a)}`},{t:'Evaluate both roots',m:`x₁ = ${N(x1)},  x₂ = ${N(x2)}`},{t:'Check by substituting back',m:`f(x₁) = ${N(f(x1))},  f(x₂) = ${N(f(x2))} ✓`});return{steps:st,ans:`x = ${N(x1)} or x = ${N(x2)}`}}
if(Math.abs(D)<=1e-9){const x=-b/(2*a);st.push({t:'Δ = 0: one repeated root',m:`x = −b / 2a = ${N(x)}`});return{steps:st,ans:`x = ${N(x)}`}}
const re=-b/(2*a),im=Math.sqrt(-D)/(2*Math.abs(a));st.push({t:'Δ < 0: no real roots, so the roots are complex',m:`x = ${N(re)} ± ${N(im)}i`});return{steps:st,ans:`No real solutions (x = ${N(re)} ± ${N(im)}i)`}}
